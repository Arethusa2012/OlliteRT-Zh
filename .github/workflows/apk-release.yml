name: Build release APK

on:
  push:
    branches: [ci/apk-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach APK to its release'
        required: true
        default: 'v943'
      version_code:
        description: 'Android versionCode'
        required: false
        default: '943'

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && 'v943' || github.event.inputs.tag }}
  VERSION_CODE: ${{ github.event_name == 'push' && '943' || github.event.inputs.version_code }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          COMPILE_SDK=$(grep -oP '(?<=compileSdk\s=\s)\d+' app/build.gradle.kts)
          BUILD_TOOLS=$(grep -oP '(?<=buildToolsVersion\s=\s")[^"]+' app/build.gradle.kts || echo "${COMPILE_SDK}.0.0")
          echo "SDK: platforms;android-${COMPILE_SDK} build-tools;${BUILD_TOOLS}"
          sdkmanager --licenses < /dev/null > /dev/null || true
          # API 37+ 在新 SDK 仓库中按次版本号拆分（android-37.0/37.1/37.2），
          # 无裸 android-37 包，全部装上让 AGP 解析
          sdkmanager "build-tools;${BUILD_TOOLS}" "platform-tools" || true
          for SUFFIX in "" ".0" ".1" ".2" ".3"; do
            sdkmanager "platforms;android-${COMPILE_SDK}${SUFFIX}" || true
          done
          ls /usr/local/lib/android/sdk/platforms/

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableRelease \
            -PAPP_VERSION_NAME="${TAG}" \
            -PAPP_VERSION_CODE="${VERSION_CODE}"

      - name: Collect APK and checksums
        run: |
          OUT_DIR="app/build/outputs/apk/stable/release"
          mkdir -p release-apks
          shopt -s nullglob
          for APK in "$OUT_DIR"/*.apk; do
            cp "$APK" "release-apks/OlliteRT-Zh-${TAG}-arm64-v8a.apk"
          done
          if [ -z "$(ls -A release-apks 2>/dev/null)" ]; then
            echo "::error::No APK found in $OUT_DIR"; exit 1
          fi
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}

name: Build release APK (dispatch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach APK to its release'
        required: true
        default: 'v943'
      version_code:
        description: 'Android versionCode'
        required: false
        default: '943'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          COMPILE_SDK=$(grep -oP '(?<=compileSdk\s=\s)\d+' app/build.gradle.kts)
          BUILD_TOOLS=$(grep -oP '(?<=buildToolsVersion\s=\s")[^"]+' app/build.gradle.kts || echo "${COMPILE_SDK}.0.0")
          echo "SDK: platforms;android-${COMPILE_SDK} build-tools;${BUILD_TOOLS}"
          sdkmanager --licenses < /dev/null > /dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStableRelease \
            -PAPP_VERSION_NAME="${{ github.event.inputs.tag }}" \
            -PAPP_VERSION_CODE="${{ github.event.inputs.version_code }}"

      - name: Collect APK and checksums
        run: |
          OUT_DIR="app/build/outputs/apk/stable/release"
          mkdir -p release-apks
          shopt -s nullglob
          for APK in "$OUT_DIR"/*.apk; do
            cp "$APK" "release-apks/OlliteRT-Zh-${{ github.event.inputs.tag }}-arm64-v8a.apk"
          done
          if [ -z "$(ls -A release-apks 2>/dev/null)" ]; then
            echo "::error::No APK found in $OUT_DIR"; exit 1
          fi
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
